<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mobile capture</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#222}body{display:grid;place-items:start center}
    .phone{width:393px;height:852px;overflow:hidden;background:#fff}
    iframe{display:block;width:393px;height:852px;border:0;background:#fff}
  </style>
</head>
<body><div class="phone"><iframe id="phone" title="iPhone 15 Pro viewport"></iframe></div>
<script>
  const target=new URLSearchParams(location.search).get('url')||'https://comino.top/community';
  document.querySelector('#phone').src=target;
</script></body>
</html>
